      - 17 GPU、算子与编译器: topics/17-gpu-kernels-compilers.md
      - 18 分布式训练: topics/18-distributed-training.md
      - 19 推理与模型服务: topics/19-inference-serving.md
      - 20 MLOps 与生产系统: topics/20-mlops.md
      - 21 端侧 AI: topics/21-edge-ai.md
  - 交叉领域:
      - 22 强化学习与机器人: topics/22-rl-robotics.md
      - 23 推荐与信息检索: topics/23-recommendation-search.md
      - 24 图学习与知识表示: topics/24-graphs.md
      - 25 因果推断与概率建模: topics/25-causal-probabilistic.md
      - 26 AI for Science: topics/26-ai-for-science.md
      - 27 经典 AI 与规划优化: topics/27-classical-ai.md
  - 实践:
      - 项目总览: projects/README.md
      - 01 线性回归: projects/01-regression.md
      - 02 检索评估: projects/02-retrieval.md
      - 03 Attention: projects/03-attention.md
      - 04 显存账本: projects/04-memory.md
      - 05 微调对照: projects/05-finetuning.md
